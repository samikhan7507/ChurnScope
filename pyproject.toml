[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churnscope"
version = "1.1.0"
description = "Production-grade customer churn prediction system with LightGBM, SHAP explainability, FastAPI, and installable PWA dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Sami Ahmad", email = "samikhan57705@gmail.com"}]
keywords = ["machine-learning", "churn-prediction", "lightgbm", "shap", "fastapi", "streamlit", "pwa", "mlops"]

dependencies = [
    "lightgbm>=4.3.0,<5.0.0",
    "xgboost>=2.0.0,<4.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "optuna>=3.6.0,<6.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<4.0.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "shap>=0.45.0,<1.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.38.0,<2.0.0",
    "plotly>=5.21.0,<8.0.0",
    "requests>=2.31.0,<3.0.0",
    "Pillow>=10.3.0,<14.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.21.0,<8.0.0",
]

[project.scripts]
churn-train = "train_pipeline:run_pipeline"
churn-predict = "predict:run_batch_inference"
churn-dashboard = "run_dashboard:main"

[tool.setuptools]
py-modules = ["train_pipeline", "predict", "streamlit_app", "run_dashboard"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

# ── Ruff Linter & Formatter ────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in default argument (FastAPI Depends)
    "N803",  # Argument name should be lowercase (X_train convention)
    "N806",  # Variable in function should be lowercase (X, y convention)
    "N815",  # MixedCase variable in class scope (Telco dataset schema field names)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "api"]
omit = ["tests/*", "notebooks/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
]
show_missing = true
fail_under = 80
