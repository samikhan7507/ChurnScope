<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00d4ff" />
  <title>ChurnScope — Offline</title>
  <link rel="icon" type="image/png" href="/app/static/favicon-32.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #020408;
      color: #e2f0ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #0c1520;
      border: 1px solid #1a3a55;
      border-top: 2px solid #00d4ff;
      border-radius: 6px;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #ffaa00;
      border: 1px solid rgba(255, 170, 0, 0.4);
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.35rem;
      letter-spacing: 5px;
      color: #00d4ff;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #7ba3c4;
      margin-bottom: 1.5rem;
    }
    button {
      width: 100%;
      padding: 0.75rem 1rem;
      background: transparent;
      color: #00d4ff;
      border: 1px solid #00d4ff;
      border-radius: 3px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover { background: rgba(0, 212, 255, 0.12); }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">SIGNAL INTERRUPTED</div>
    <h1>CHURNSCOPE</h1>
    <p>
      Network connection is currently unavailable. ChurnScope will automatically resume
      real-time churn predictions as soon as your connection returns.
    </p>
    <button type="button" onclick="window.location.reload()">Retry Connection</button>
  </main>
  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
