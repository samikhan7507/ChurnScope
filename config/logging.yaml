# ============================================================
# ChurnScope — Structured Logging Configuration
# Loaded by src.setup_logging() via logging.config.dictConfig()
# Falls back to console-only automatically if logs/ is read-only.
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(funcName)s() | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_rotating:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/churn_prediction.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8

  api_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/api_requests.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  api:
    level: INFO
    handlers: [console, api_file]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

  lightgbm:
    level: WARNING
    handlers: [console]
    propagate: false

  optuna:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console, file_rotating, error_file]
