# ============================================================
# ChurnScope — Central Configuration
# Environment variables (see .env.example) override matching keys.
# ============================================================

project:
  name: "churnscope"
  version: "1.1.0"
  description: "Production-grade customer churn prediction system"

paths:
  raw_data: "data/raw/telco_churn.csv"
  processed_data: "data/processed/"
  features_data: "data/features/"
  model_dir: "models/trained/"
  artifact_dir: "models/artifacts/"
  registry: "models/registry/model_registry.json"
  logging_config: "config/logging.yaml"
  logs: "logs/"

data:
  target_column: "Churn"
  customer_id_column: "customerID"
  numeric_features:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical_features:
    - "gender"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"
    - "SeniorCitizen"
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true

feature_engineering:
  create_tenure_bands: true
  create_charge_ratios: true
  create_service_count: true
  create_interaction_features: true
  create_contract_flags: true

model:
  algorithm: "lightgbm"
  version: "v1"
  lightgbm_params:
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 4
    num_leaves: 15
    min_child_samples: 40
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_alpha: 0.5
    reg_lambda: 2.0
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost_params:
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 4
    min_child_weight: 6
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.5
    reg_lambda: 2.0
    scale_pos_weight: 2.77
    eval_metric: "logloss"
    random_state: 42
    n_jobs: -1
  cross_validation:
    n_splits: 5
    scoring: "roc_auc"
  early_stopping:
    enabled: true
    rounds: 50
  calibration:
    enabled: true
    method: "sigmoid"   # "sigmoid" (Platt scaling) | "isotonic"

promotion_gate:
  enabled: true
  min_roc_auc: 0.75
  max_roc_auc_drop: 0.015

optuna:
  enabled: false
  n_trials: 40
  timeout: 600
  direction: "maximize"
  metric: "roc_auc"

threshold:
  default: 0.5
  optimize: true
  strategy: "f1"   # "f1" | "roi" | "custom_cost" | "recall"
  min_recall: 0.80
  cost_matrix:
    fn_cost: 5
    fp_cost: 1

business:
  avg_monthly_revenue: 65.0
  expected_retained_months: 6
  retention_offer_cost: 25.0
  retention_success_rate: 0.35
  top_k_fractions: [0.10, 0.20]

api:
  host: "0.0.0.0"
  port: 8000
  workers: 2
  reload: false
  title: "ChurnScope Prediction API"
  description: "Production ML API for telecom customer churn prediction and real-time SHAP explainability."
  version: "1.1.0"
  docs_url: "/docs"
  redoc_url: "/redoc"
  model_version: "v1"
  max_batch_size: 1000
  cors_origins:
    - "http://localhost:8501"
    - "http://127.0.0.1:8501"
    - "http://localhost:3000"
  rate_limit_per_minute: 120
  enable_metrics: true
  auto_train_on_startup: false
  auto_train_samples: 5000

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/churn_prediction.log"
  max_bytes: 10485760
  backup_count: 5
