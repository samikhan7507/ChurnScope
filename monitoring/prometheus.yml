# ============================================================
# Prometheus Scrape Configuration — ChurnScope API
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "churn_prediction_api"
    static_configs:
      - targets: ["churnscope-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
