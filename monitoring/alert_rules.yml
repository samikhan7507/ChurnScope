# ============================================================
# Prometheus Alert Rules — ChurnScope Prediction API
# ============================================================

groups:
  - name: churnscope_api_alerts
    rules:
      - alert: ChurnAPIDown
        expr: up{job="churn_prediction_api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ChurnScope API is unreachable"
          description: "The churn prediction API has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="churn_prediction_api", status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="churn_prediction_api"}[5m])), 1e-9)
          ) > 0.05
          and sum(rate(http_requests_total{job="churn_prediction_api"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on ChurnScope API"
          description: "5xx error ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket{job="churn_prediction_api"}[5m])) by (le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 API latency exceeds 1 second"
          description: "95th percentile response time is {{ $value }}s."

      - alert: ModelNotLoaded
        expr: churn_model_loaded{job="churn_prediction_api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "ChurnScope ML model is not loaded"
          description: "The API is running in degraded mode without an active model artifact."

      - alert: PredictionRateDrift
        expr: |
          abs(
            (
              sum(rate(churn_predictions_total{job="churn_prediction_api", prediction="1"}[1h]))
              /
              clamp_min(sum(rate(churn_predictions_total{job="churn_prediction_api"}[1h])), 1e-9)
            ) - 0.397
          ) > 0.12
          and sum(increase(churn_predictions_total{job="churn_prediction_api"}[1h])) >= 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Predicted churn rate drift detected"
          description: "Live positive prediction ratio deviated >12% from test baseline (39.7% at threshold 0.2757)."
