name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'arena/**'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --upgrade pip 'ruff>=0.4.0,<1.0.0'
      - name: Ruff lint check
        run: >-
          ruff check src/ api/ tests/
          train_pipeline.py predict.py streamlit_app.py
          run_dashboard.py scripts/generate_pwa_assets.py
      - name: Ruff format check
        run: >-
          ruff format --check src/ api/ tests/
          train_pipeline.py predict.py streamlit_app.py
          run_dashboard.py scripts/generate_pwa_assets.py

  test:
    name: Pipeline, Unit & API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dashboard.txt
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Prepare runtime directories
        run: mkdir -p data/raw data/processed data/features models/trained models/artifacts models/registry logs results
      - name: Run training pipeline
        run: python train_pipeline.py --synthetic --n-samples 2500 --force-promote
      - name: Run CLI batch inference (>1,000 rows)
        run: python predict.py --input data/raw/telco_churn.csv --output results/ci_scores.csv
      - name: Run pytest with coverage gate (>=80%)
        run: pytest tests/ -v --cov=src --cov=api --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build & Live Smoke Test (API + PWA)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Production API image
        run: docker build --target production --tag churnscope-api:ci-${{ github.sha }} .
      - name: Build Dashboard PWA image
        run: docker build --target dashboard --tag churnscope-dashboard:ci-${{ github.sha }} .
      - name: Smoke test API (/health/ready, /predict/explain, /metrics)
        run: |
          docker run -d --name churnscope-api-test -p 8000:8000 \
            -e AUTO_TRAIN_ON_STARTUP=true \
            -e AUTO_TRAIN_SAMPLES=2000 \
            churnscope-api:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready || true)
            [ "$STATUS" = "200" ] && break
            sleep 2
          done
          [ "$STATUS" = "200" ] || { docker logs churnscope-api-test; exit 1; }
          curl -fsS -X POST http://127.0.0.1:8000/predict/explain \
            -H 'Content-Type: application/json' \
            -d '{"customerID":"CI-001","gender":"Female","SeniorCitizen":"0","Partner":"Yes","Dependents":"No","tenure":3,"PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No","StreamingTV":"Yes","StreamingMovies":"Yes","Contract":"Month-to-month","PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":95.5,"TotalCharges":286.5}' \
            | grep -q '"shap_values"'
          curl -fsS http://127.0.0.1:8000/metrics | grep -q 'churn_model_loaded 1.0'
      - name: Smoke test Dashboard PWA (/_stcore/health, /manifest.json, /sw.js)
        run: |
          docker run -d --name churnscope-ui-test -p 8501:8501 \
            -e API_BASE_URL=http://127.0.0.1:8000 \
            churnscope-dashboard:ci-${{ github.sha }}
          for i in $(seq 1 25); do
            UI_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/_stcore/health || true)
            [ "$UI_STATUS" = "200" ] && break
            sleep 2
          done
          [ "$UI_STATUS" = "200" ] || { docker logs churnscope-ui-test; exit 1; }
          curl -fsS http://127.0.0.1:8501/manifest.json | grep -q '"standalone"'
          curl -fsSI http://127.0.0.1:8501/sw.js | grep -iq 'service-worker-allowed: /'
      - name: Cleanup containers
        if: always()
        run: docker rm -f churnscope-api-test churnscope-ui-test || true

  publish:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize repository name to lowercase for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/api:latest
            ghcr.io/${{ steps.repo.outputs.name }}/api:sha-${{ github.sha }}
      - name: Build and push Dashboard PWA image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dashboard
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/dashboard:latest
            ghcr.io/${{ steps.repo.outputs.name }}/dashboard:sha-${{ github.sha }}
